name: Security audit probe

on:
  push:
    branches:
      - chore/dependency-security-hardening
    paths:
      - .github/workflows/refresh-security-lockfile.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v3
        with:
          version: 11.21.0
          run_install: false

      - name: Audit root
        run: pnpm audit --audit-level high

      - name: Audit extension
        working-directory: extension
        run: pnpm audit --audit-level high
