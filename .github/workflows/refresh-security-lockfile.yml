name: Refresh extension security lockfile

on:
  push:
    branches:
      - chore/dependency-security-hardening
    paths:
      - .github/workflows/refresh-security-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dependency-security-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v3
        with:
          version: 11.21.0
          run_install: false

      - name: Regenerate extension lockfile
        working-directory: extension
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit extension lockfile
        run: |
          if git diff --quiet -- extension/pnpm-lock.yaml; then
            echo "Extension lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/pnpm-lock.yaml
          git commit -m "chore(deps): refresh extension security lockfile"
          git push
