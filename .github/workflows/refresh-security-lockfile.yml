name: Security audit probe

on:
  push:
    branches:
      - chore/dependency-security-hardening
    paths:
      - .github/workflows/refresh-security-lockfile.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v3
        with:
          version: 11.21.0
          run_install: false

      - name: Audit root and extension
        shell: bash
        run: |
          set +e
          echo "::group::Root audit"
          pnpm audit --audit-level high
          ROOT_STATUS=$?
          echo "::endgroup::"

          echo "::group::Extension audit"
          (cd extension && pnpm audit --audit-level high)
          EXT_STATUS=$?
          echo "::endgroup::"

          echo "root_audit_status=$ROOT_STATUS"
          echo "extension_audit_status=$EXT_STATUS"

          if [ "$ROOT_STATUS" -ne 0 ] || [ "$EXT_STATUS" -ne 0 ]; then
            exit 1
          fi
