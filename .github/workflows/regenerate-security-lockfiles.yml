name: Regenerate final security lockfiles

on:
  push:
    branches:
      - chore/dependency-security-hardening
    paths:
      - .github/workflows/regenerate-security-lockfiles.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/dependency-security-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v3
        with:
          version: 11.21.0
          run_install: false

      - name: Regenerate root lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Regenerate extension lockfile
        working-directory: extension
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfiles
        run: |
          if git diff --quiet -- pnpm-lock.yaml extension/pnpm-lock.yaml; then
            echo "Lockfiles already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml extension/pnpm-lock.yaml
          git commit -m "chore(deps): refresh final security lockfiles"
          git push
