version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Jakarta"
    # Routine npm version updates are intentionally disabled.
    # Dependabot security updates remain handled separately.
    open-pull-requests-limit: 0
    ignore:
      # GHSA-vfj7-8cjw-p6xm: npm latest is 3.0.3; Dependabot fails with
      # security_update_not_found when no newer patched release exists.
      - dependency-name: "braces"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
