version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # Unpatchable on npm (Chief approved 2026-10-11). Revisit when patched releases publish.
      - dependency-name: braces
      - dependency-name: node-forge
      - dependency-name: sprintf-js

